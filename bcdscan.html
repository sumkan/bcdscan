<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>バーコード読み取り & カメラ撮影アプリ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- ZXing Library for Barcode/QR Scanning -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        /* タップ時のハイライトを無効化 */
        * { -webkit-tap-highlight-color: transparent; }
        /* スキャンラインのアニメーション */
        @keyframes scan {
            0% { top: 0%; opacity: 0.8; }
            50% { opacity: 1; }
            100% { top: 100%; opacity: 0.8; }
        }
        .scan-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, rgba(239, 68, 68, 0) 0%, rgba(239, 68, 68, 1) 50%, rgba(239, 68, 68, 0) 100%);
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.8);
            animation: scan 2s linear infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans select-none">

    <!-- ヘッダー -->
    <header class="bg-slate-800/80 backdrop-blur border-b border-slate-700 p-4 sticky top-0 z-20 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <i data-lucide="barcode" class="w-6 h-6 text-indigo-400"></i>
            <h1 class="text-lg font-bold tracking-wide">Barcode Cam</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button id="switchCamBtn" class="p-2 rounded-full bg-slate-700 active:bg-slate-600 text-slate-200 transition">
                <i data-lucide="switch-camera" class="w-5 h-5"></i>
            </button>
            <button id="torchBtn" class="p-2 rounded-full bg-slate-700 active:bg-slate-600 text-slate-200 transition hidden">
                <i data-lucide="zap" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="flex-1 flex flex-col p-4 max-w-md mx-auto w-full justify-between space-y-4">

        <!-- カメラビューエリア -->
        <div class="relative w-full aspect-[3/4] bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800 flex items-center justify-center">
            
            <!-- ビデオタグ (カメラ読み込み) -->
            <video id="video" class="w-full h-full object-cover"></video>
            
            <!-- 非表示のキャンバス (画像処理・キャプチャ用) -->
            <canvas id="canvas" class="hidden"></canvas>

            <!-- スキャンガイドオーバーレイ -->
            <div id="scanOverlay" class="absolute inset-0 border-[3rem] border-black/50 pointer-events-none flex items-center justify-center">
                <div class="relative w-full h-40 border-2 border-indigo-400/80 rounded-lg overflow-hidden">
                    <div class="scan-line"></div>
                    <!-- 四隅のコーナー描画 -->
                    <div class="absolute top-0 left-0 w-4 h-4 border-t-2 border-l-2 border-indigo-400"></div>
                    <div class="absolute top-0 right-0 w-4 h-4 border-t-2 border-r-2 border-indigo-400"></div>
                    <div class="absolute bottom-0 left-0 w-4 h-4 border-b-2 border-l-2 border-indigo-400"></div>
                    <div class="absolute bottom-0 right-0 w-4 h-4 border-b-2 border-r-2 border-indigo-400"></div>
                </div>
            </div>

            <!-- エラー表示 -->
            <div id="cameraError" class="hidden absolute inset-0 bg-slate-900/90 flex flex-col items-center justify-center p-6 text-center">
                <i data-lucide="camera-off" class="w-12 h-12 text-rose-500 mb-3"></i>
                <p id="errorMessage" class="text-sm text-slate-300">カメラにアクセスできません。アクセス許可を確認してください。</p>
                <button id="retryBtn" class="mt-4 px-4 py-2 bg-indigo-600 rounded-lg text-sm font-semibold active:bg-indigo-700">再試行</button>
            </div>
        </div>

        <!-- ステータス & 読み取り結果表示エリア -->
        <div class="bg-slate-800 rounded-xl p-4 border border-slate-700/80 shadow-lg flex flex-col space-y-2">
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider flex items-center justify-between">
                <span>検出されたバーコード</span>
                <span id="barcodeType" class="text-xs bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full hidden">UNKNOWN</span>
            </div>
            <div class="flex items-center space-x-2">
                <i data-lucide="scan-line" id="statusIcon" class="w-5 h-5 text-amber-400 animate-pulse"></i>
                <div id="barcodeResult" class="text-xl font-mono font-bold text-slate-100 truncate">
                    読み取り待機中...
                </div>
            </div>
        </div>

        <!-- 保存アクションエリア -->
        <div class="space-y-3">
            <button id="captureBtn" class="w-full py-4 bg-gradient-to-r from-indigo-500 to-purple-600 active:from-indigo-600 active:to-purple-700 rounded-xl font-bold text-lg shadow-lg shadow-indigo-500/25 flex items-center justify-center space-x-2 transition transform active:scale-[0.98]">
                <i data-lucide="camera" class="w-6 h-6"></i>
                <span>画像をキャプチャして保存</span>
            </button>
            <div class="text-center text-xs text-slate-500">
                ※バーコード未検出時は「nobarcode_日時.jpg」で保存されます
            </div>
        </div>
    </main>

    <!-- トースト通知 -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-emerald-500 text-white px-5 py-3 rounded-full shadow-2xl flex items-center space-x-2 opacity-0 pointer-events-none transition-all duration-300 z-50">
        <i data-lucide="check-circle-2" class="w-5 h-5"></i>
        <span id="toastMessage" class="text-sm font-medium">保存しました</span>
    </div>

    <script>
        // Lucideアイコンの初期化
        lucide.createIcons();

        // UI要素の取得
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const barcodeResult = document.getElementById('barcodeResult');
        const barcodeType = document.getElementById('barcodeType');
        const statusIcon = document.getElementById('statusIcon');
        const captureBtn = document.getElementById('captureBtn');
        const switchCamBtn = document.getElementById('switchCamBtn');
        const torchBtn = document.getElementById('torchBtn');
        const cameraError = document.getElementById('cameraError');
        const errorMessage = document.getElementById('errorMessage');
        const retryBtn = document.getElementById('retryBtn');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        // 状態変数
        let codeReader = null;
        let selectedDeviceId = null;
        let videoDevices = [];
        let currentBarcode = null;
        let currentFormat = null;
        let isTorchOn = false;

        // ZXing バーコードリーダーの初期化
        async function initScanner() {
            try {
                codeReader = new ZXing.BrowserMultiFormatReader();
                
                // 使用可能なビデオ入力デバイス（カメラ）を取得
                const videoInputDevices = await codeReader.listVideoInputDevices();
                videoDevices = videoInputDevices;

                if (videoInputDevices.length === 0) {
                    showError("カメラが見つかりませんでした。");
                    return;
                }

                // 背面カメラを優先選択
                const backCamera = videoInputDevices.find(device => 
                    /back|rear|environment/i.test(device.label)
                );
                selectedDeviceId = backCamera ? backCamera.deviceId : videoInputDevices[0].deviceId;

                startScanning();
            } catch (err) {
                console.error("初期化エラー:", err);
                showError("カメラへのアクセス許可が必要です。設定を確認してください。");
            }
        }

        // スキャン開始処理
        function startScanning() {
            cameraError.classList.add('hidden');
            codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
                if (result) {
                    // バーコード検出時
                    currentBarcode = result.getText();
                    currentFormat = result.getBarcodeFormat();
                    
                    // UI更新
                    barcodeResult.textContent = currentBarcode;
                    barcodeType.textContent = getFormatName(currentFormat);
                    barcodeType.classList.remove('hidden');

                    statusIcon.setAttribute('data-lucide', 'check-circle-2');
                    statusIcon.className = "w-5 h-5 text-emerald-400";
                    lucide.createIcons();

                    // 効果音（ビープ音）を軽く鳴らす
                    playBeep();
                }
            }).catch((err) => {
                console.error("スキャンエラー:", err);
                showError("カメラストリームの読み込みに失敗しました。");
            });
        }

        // フォーマット名の変換
        function getFormatName(formatEnum) {
            // ZXingのFormat列挙体の文字列化
            return ZXing.BarcodeFormat[formatEnum] || 'UNKNOWN';
        }

        // カメラ切り替え処理
        switchCamBtn.addEventListener('click', () => {
            if (videoDevices.length <= 1) {
                showToast("利用可能な他のカメラがありません");
                return;
            }
            // 次のカメラを選択
            const currentIndex = videoDevices.findIndex(d => d.deviceId === selectedDeviceId);
            const nextIndex = (currentIndex + 1) % videoDevices.length;
            selectedDeviceId = videoDevices[nextIndex].deviceId;

            codeReader.reset();
            startScanning();
        });

        // キャプチャ & 画像保存処理
        captureBtn.addEventListener('click', () => {
            if (!video.srcObject) return;

            // Canvasに現在のビデオフレームを描画
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            // 保存ファイル名の決定
            let filename = '';
            if (currentBarcode) {
                // ファイル名に使えない文字を除去
                const safeBarcode = currentBarcode.replace(/[/\\?%*:|"<>]/g, '-');
                filename = `${safeBarcode}.jpg`;
            } else {
                // バーコードが読み取れていない場合はタイムスタンプ
                const now = new Date();
                const timestamp = now.getFullYear() +
                    String(now.getMonth() + 1).padStart(2, '0') +
                    String(now.getDate()).padStart(2, '0') + '_' +
                    String(now.getHours()).padStart(2, '0') +
                    String(now.getMinutes()).padStart(2, '0') +
                    String(now.getSeconds()).padStart(2, '0');
                filename = `nobarcode_${timestamp}.jpg`;
            }

            // 画像をダウンロード処理
            canvas.toBlob((blob) => {
                if (!blob) return;
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);

                showToast(`保存しました: ${filename}`);
            }, 'image/jpeg', 0.92);
        });

        // ビープ音生成 (Web Audio API)
        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = 1000; // 1kHz
                gain.gain.value = 0.1; // 音量
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1); // 0.1秒間発音
            } catch (e) {
                // AudioContext非対応環境やブラウザのインタラクション制限用エラーを無視
            }
        }

        // トースト通知表示
        function showToast(message) {
            toastMessage.textContent = message;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100', '-translate-y-2');

            setTimeout(() => {
                toast.classList.remove('opacity-100', '-translate-y-2');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // エラー表示処理
        function showError(msg) {
            errorMessage.textContent = msg;
            cameraError.classList.remove('hidden');
        }

        // 再試行ボタン
        retryBtn.addEventListener('click', () => {
            if (codeReader) {
                codeReader.reset();
            }
            initScanner();
        });

        // ページロード時の初期化
        window.addEventListener('load', initScanner);

        // ページが閉じられる・裏に回った際のリソース解放
        window.addEventListener('beforeunload', () => {
            if (codeReader) {
                codeReader.reset();
            }
        });
    </script>
</body>
</html>
